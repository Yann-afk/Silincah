<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f8f6" />
    <meta
      name="description"
      content="Prototipe redesain portal akademik SILINCAH STMIK Tazkia. Data dummy 100% lokal."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SILINCAH Redesign — Portal Akademik</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('silincah.theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
